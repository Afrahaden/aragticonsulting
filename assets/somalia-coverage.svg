<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" role="img" aria-labelledby="title desc">
  <title id="title">Somalia coverage illustration</title>
  <desc id="desc">Stylized map-shaped illustration highlighting Mogadishu as headquarters and intended service coverage across Somalia, Somaliland, and Puntland.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C8E9E4"/><stop offset="1" stop-color="#8DCFC6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#159C91" opacity=".15"/>
    </pattern>
  </defs>
  <rect width="540" height="470" rx="24" fill="#F0F8F7"/>
  <circle cx="265" cy="235" r="188" fill="none" stroke="#D4EAE7" stroke-width="1.5"/>
  <circle cx="265" cy="235" r="145" fill="none" stroke="#D4EAE7" stroke-width="1.5" stroke-dasharray="5 8"/>
  <rect width="540" height="470" fill="url(#dots)"/>
  <!-- Simplified conceptual silhouette, not a geographic boundary reference. -->
  <path d="M143 89 214 103 271 100 334 121 382 137 432 124 463 145 428 183 389 218 363 256 344 299 326 343 295 385 269 415 253 370 244 330 223 292 204 255 177 225 152 190 131 143Z"
    fill="url(#land)" stroke="#159C91" stroke-width="3" stroke-linejoin="round"/>
  <path d="M143 89 214 103 271 100 334 121 382 137 432 124" fill="none" stroke="#102C42" stroke-opacity=".16" stroke-width="2"/>
  <path d="M154 178 215 171 272 181 331 176 395 181M185 229 253 228 342 232" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 8" opacity=".8"/>
  <circle cx="306" cy="339" r="16" fill="#159C91" opacity=".17"/>
  <circle cx="306" cy="339" r="8" fill="#159C91" stroke="#fff" stroke-width="3"/>
  <path d="M316 338 370 321" stroke="#102C42" stroke-width="1.5"/>
  <rect x="367" y="301" width="131" height="45" rx="8" fill="#fff" stroke="#DAE9E7"/>
  <text x="379" y="318" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#102C42">Mogadishu</text>
  <text x="379" y="333" font-family="Arial,sans-serif" font-size="9.5" fill="#159C91">Headquarters</text>
  <text x="30" y="41" font-family="Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="2" fill="#102C42">SOMALIA</text>
  <text x="30" y="58" font-family="Arial,sans-serif" font-size="10" fill="#6F9297">Intended service coverage</text>
  <text x="30" y="443" font-family="Arial,sans-serif" font-size="9" fill="#6F9297">Illustrative graphic — not to scale</text>
</svg>
